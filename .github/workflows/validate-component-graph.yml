name: Validate Component Graph

on:
  push:
    paths:
      - "components/**/*.component.json"
      - "component.schema.json"
      - "examples/**/*.request.json"
      - "tools/validate_component_graph.py"
      - "tools/compile_build_manifest.py"
      - ".github/workflows/validate-component-graph.yml"
  pull_request:
    paths:
      - "components/**/*.component.json"
      - "component.schema.json"
      - "examples/**/*.request.json"
      - "tools/validate_component_graph.py"
      - "tools/compile_build_manifest.py"
      - ".github/workflows/validate-component-graph.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate descriptors and dependency graph
        run: python3 tools/validate_component_graph.py --report reports/component-graph.json
      - name: Compile Pet Survival Game example
        run: python3 tools/compile_build_manifest.py examples/pet-survival-game.request.json --output reports/pet-survival-game.manifest.json
      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-library-reports
          path: reports/
          if-no-files-found: error
